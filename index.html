<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lounge Cocktail Cheat Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one phone-width column. Sticky search, then family sections; each opens with the shared build, then full recipes. */
:root{
  --bg:#f3f5f1; --card:#ffffff; --fg:#16211c; --muted:#56655d; --line:#d5dcd4;
  --accent:#0f6b4f; --accent-soft:#dcefe6; --af:#8a3d00; --af-soft:#fde9d2; --warn:#8f1d2c; --warn-soft:#fbe1e4;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101613; --card:#1a2420; --fg:#edf2ee; --muted:#a3b1a9; --line:#2f3d36;
  --accent:#6fd3ac; --accent-soft:#17382c; --af:#ffb873; --af-soft:#3d2a14; --warn:#ff9aa6; --warn-soft:#42191f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101613; --card:#1a2420; --fg:#edf2ee; --muted:#a3b1a9; --line:#2f3d36;
  --accent:#6fd3ac; --accent-soft:#17382c; --af:#ffb873; --af-soft:#3d2a14; --warn:#ff9aa6; --warn-soft:#42191f; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
#q{width:100%;font:inherit;font-size:1.1rem;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
#q:focus-visible,.chip:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-weight:700;font-size:.95rem;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.rule{background:var(--af-soft);color:var(--af);border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:700}
section{margin-top:26px;scroll-margin-top:150px}
h2{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:0 0 10px}
.pattern{background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pattern b.t{font-family:var(--display);color:var(--accent);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.pattern ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.list{display:flex;flex-direction:column;gap:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px;border-radius:14px}
summary::-webkit-details-marker{display:none}
summary .n{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.2;flex:1;min-width:0}
summary::after{content:"+";font-size:1.5rem;line-height:1;color:var(--muted);font-weight:700}
details[open] summary::after{content:"–"}
.af{flex:none;background:var(--af-soft);color:var(--af);font-weight:700;font-size:.75rem;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.ing{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:1.1rem}
.ing li{display:grid;grid-template-columns:5.2em 1fr;gap:8px}
.ing .a{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.meta{display:grid;grid-template-columns:5.2em 1fr;gap:5px 8px;margin:0;padding-top:12px;border-top:1px solid var(--line)}
.meta dt{color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding-top:.2em}
.meta dd{margin:0}
.check{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.95rem}
#none{margin-top:28px;color:var(--muted);text-align:center}
</style>

</head>

function e(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var out=document.getElementById("out"),chips=document.getElementById("chips"),h="",ch="";
F.forEach(function(f){
  ch+='<button class="chip" type="button" data-go="'+f.id+'">'+e(f.t)+'</button>';
  h+='<section id="'+f.id+'"><h2>'+e(f.t)+'</h2><div class="pattern"><b class="t">Same every time</b><ul>'+f.p.map(function(x){return"<li>"+e(x)+"</li>"}).join("")+"</ul>";
  if(f.c)h+='<b class="t">What changes</b><ul>'+f.c.map(function(x){return"<li>"+e(x)+"</li>"}).join("")+"</ul>";
  h+='</div><div class="list">';
  f.d.forEach(function(d){
    var s=d[0].toLowerCase();
    h+='<details data-s="'+e(s).replace(/"/g,"&quot;")+'"><summary><span class="n">'+e(d[0])+"</span>"+(d[1]?'<span class="af">AF</span>':"")+'</summary><div class="body"><ul class="ing">'+
      d[2].map(function(i){return'<li><span class="a">'+e(i[0])+"</span><span>"+e(i[1])+"</span></li>"}).join("")+"</ul>";
    if(d[7])h+='<div class="check">'+e(d[7])+"</div>";
    if(d[3])h+='<dl class="meta"><dt>Glass</dt><dd>'+e(d[3])+"</dd><dt>Ice</dt><dd>"+e(d[4])+"</dd><dt>Method</dt><dd>"+e(d[5])+"</dd><dt>Garnish</dt><dd>"+e(d[6])+"</dd></dl>";
    h+="</div></details>";
  });
  h+="</div></section>";
});
out.innerHTML=h;chips.innerHTML=ch;
chips.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-go]");if(!b)return;
  q.value="";filter();
  document.getElementById(b.dataset.go).scrollIntoView({behavior:"smooth",block:"start"});
});
var q=document.getElementById("q");
function filter(){
  var v=q.value.trim().toLowerCase(),any=false;
  document.querySelectorAll("section").forEach(function(sec){
    var n=0;
    sec.querySelectorAll("details").forEach(function(d){
      var m=!v||d.dataset.s.indexOf(v)>-1;d.hidden=!m;d.open=!!v&&m;if(m)n++;
    });
    sec.hidden=!n;sec.querySelector(".pattern").hidden=!!v;if(n)any=true;
  });
  document.getElementById("rule").hidden=!!v;
  document.getElementById("none").hidden=any;
}
q.addEventListener("input",filter);
</script>
<script>
// One GoatCounter row per action; the detail (drink / search term) goes in the referrer so it shows as a breakdown when the row is clicked.
function gc(p,t,r){try{if(window.goatcounter&&goatcounter.count)goatcounter.count({path:p,title:t,referrer:r,event:true})}catch(x){}}
var seen={};
document.getElementById("out").addEventListener("toggle",function(ev){var d=ev.target;if(d.open&&!q.value.trim())gc("lounge-drink-opened","Drink opened",d.querySelector(".n").textContent.trim())},true);
var st;q.addEventListener("input",function(){clearTimeout(st);st=setTimeout(function(){var v=q.value.trim().toLowerCase();if(v.length>2&&!seen[v]){seen[v]=1;gc("lounge-search","Lounge searches",v)}},1500)});
</script>
<script data-goatcounter="https://jejo.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
