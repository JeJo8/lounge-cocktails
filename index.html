<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Cash Calculator</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px 0}
    .container{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:24px 20px;width:100%;max-width:640px}
    h1{font-size:1.3rem;color:#1a1a2e;margin-bottom:4px}
    .subtitle{color:#6b7280;font-size:.82rem;margin-bottom:20px}

    .section-title{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#fff;padding:5px 12px;border-radius:20px;margin-bottom:12px;display:inline-block}
    .section-title.coins{background:#6366f1}
    .section-title.notes{background:#0ea5e9}

    .table-header{display:grid;gap:8px;padding:0 4px 8px;border-bottom:2px solid #e5e7eb;margin-bottom:8px}
    .coins-header{grid-template-columns:58px 1fr 62px 72px}
    .notes-header{grid-template-columns:58px 1fr 72px}
    .table-header span{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af}

    .coin-grid,.notes-grid{display:grid;gap:6px;margin-bottom:20px}
    .coin-row{display:grid;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;transition:background .15s}
    .coin-row:hover{background:#f9fafb}
    .coin-row.active{background:#f0f4ff}
    .note-row.active{background:#f0f9ff}
    .coins-row{grid-template-columns:58px 1fr 62px 72px}
    .notes-row{grid-template-columns:58px 1fr 72px}

    .coin-label{font-weight:700;font-size:.95rem;color:#1f2937}
    .coin-label span{display:block;font-size:.65rem;font-weight:400;color:#9ca3af}

    input[type=number],input[type=text]{width:100%;padding:10px 8px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:1rem;color:#111827;transition:border-color .2s;text-align:center;min-height:44px;-moz-appearance:textfield;appearance:textfield}
    input[type=number]:focus,input[type=text]:focus{outline:none;border-color:#6366f1}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1}

    .coin-count{font-size:.85rem;color:#6b7280;text-align:center}
    .coin-count.has-value{color:#374151;font-weight:600}
    .coin-value{font-size:.9rem;font-weight:700;color:#d1d5db;text-align:right}
    .coin-value.has-value{color:#059669}
    .note-value.has-value{color:#0ea5e9}

    .totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .subtotal-bar{border-radius:10px;padding:12px 14px}
    .subtotal-bar.coins{background:#f0f4ff;border:1.5px solid #c7d2fe}
    .subtotal-bar.notes{background:#f0f9ff;border:1.5px solid #bae6fd}
    .subtotal-label{font-size:.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .subtotal-value{font-size:1.2rem;font-weight:800}
    .subtotal-bar.coins .subtotal-value{color:#4338ca}
    .subtotal-bar.notes .subtotal-value{color:#0284c7}

    .total-bar{display:flex;justify-content:space-between;align-items:center;background:#1a1a2e;border-radius:10px;padding:14px 18px;margin-bottom:12px}
    .total-label{font-weight:700;color:#e5e7eb;font-size:.9rem}
    .total-label span{display:block;font-size:.72rem;font-weight:400;color:#6b7280}
    .total-value{font-size:1.8rem;font-weight:800;color:#a5b4fc}

    .closed-by{margin-bottom:12px}
    .closed-label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin-bottom:6px}
    .closed-by input[type=text]{text-align:left;padding:11px 14px;font-weight:600}
    .closed-by input[type=text]::placeholder{color:#d1d5db;font-weight:400}

    .timestamp-bar{display:flex;align-items:center;gap:10px;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 14px;margin-bottom:12px}
    .timestamp-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;white-space:nowrap}
    .timestamp-value{flex:1;font-size:.9rem;font-weight:600;color:#1f2937}
    .stamp-btn{padding:6px 12px;background:#6366f1;color:#fff;border:none;border-radius:6px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
    .stamp-btn:hover{opacity:.85}

    .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
    button{padding:12px;border-radius:8px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;min-height:44px;transition:opacity .15s}
    button:hover{opacity:.85}
    #exportBtn{background:#6366f1;color:#fff}
    #resetBtn{background:#f3f4f6;color:#374151;border:1.5px solid #e5e7eb}

    .section-gap{margin-bottom:20px}

    .signature-bar{width:100%;max-width:640px;text-align:center;padding:18px 12px 24px}
    .signature-name{font-size:1.1rem;font-weight:800;color:#4338ca;letter-spacing:.04em;text-decoration:none;border-bottom:2px solid #c7d2fe;transition:color .2s,border-color .2s}
    .signature-name:hover{color:#6366f1;border-color:#6366f1}
    .signature-sub{font-size:.78rem;color:#9ca3af;margin-top:2px}

    @media(max-width:400px){
      .container{padding:18px 12px}
      .totals-grid{grid-template-columns:1fr}
      .coins-row,.coins-header{grid-template-columns:50px 1fr 54px 64px}
      .notes-row,.notes-header{grid-template-columns:50px 1fr 64px}
      .total-value{font-size:1.5rem}
    }
  </style>
</head>
<body>

<div class="container">
  <h1>&#x1FA99; UK Cash Calculator</h1>
  <p class="subtitle">Coins by weight (g) &middot; Notes by quantity &middot; Updates instantly</p>

  <div class="section-gap">
    <div class="section-title coins">Coins</div>
    <div class="table-header coins-header">
      <span>Coin</span><span style="text-align:center">Weight (g)</span><span style="text-align:center">Count</span><span style="text-align:right">Value</span>
    </div>
    <div class="coin-grid" id="coinGrid"></div>
  </div>

  <div class="section-gap">
    <div class="section-title notes">Notes</div>
    <div class="table-header notes-header">
      <span>Note</span><span style="text-align:center">Quantity</span><span style="text-align:right">Value</span>
    </div>
    <div class="notes-grid" id="notesGrid"></div>
  </div>

  <div class="totals-grid">
    <div class="subtotal-bar coins">
      <div class="subtotal-label">Coins Total</div>
      <div class="subtotal-value" id="coinsTotal">&#163;0.00</div>
    </div>
    <div class="subtotal-bar notes">
      <div class="subtotal-label">Notes Total</div>
      <div class="subtotal-value" id="notesTotal">&#163;0.00</div>
    </div>
  </div>

  <div class="total-bar">
    <div class="total-label">Grand Total<span id="totalItems">0 items</span></div>
    <div class="total-value" id="grandTotal">&#163;0.00</div>
  </div>

  <div class="closed-by">
    <label class="closed-label" for="closedBy">Cash closed by</label>
    <input type="text" id="closedBy" placeholder="Enter your name..." autocomplete="name">
  </div>

  <div class="timestamp-bar">
    <span class="timestamp-label">Closed at</span>
    <span class="timestamp-value" id="timestamp">&mdash;</span>
    <button class="stamp-btn" id="stampBtn">Set Now</button>
  </div>

  <div class="btn-row">
    <button id="exportBtn">&#x2B07; Export PDF</button>
    <button id="resetBtn">&#x21BA; Reset All</button>
  </div>
</div>

<div class="signature-bar">
  <a class="signature-name" href="https://jejo8.github.io/port-folio/" target="_blank">JeJo Barista &middot; Aylesbury</a>
  <div class="signature-sub">UK Cash Calculator</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function() {
  var COINS = [
    { label: '£2',  pence: 200, weight: 12.00 },
    { label: '£1',  pence: 100, weight: 8.75  },
    { label: '50p', pence: 50,  weight: 8.00  },
    { label: '20p', pence: 20,  weight: 5.00  },
    { label: '10p', pence: 10,  weight: 6.50  },
    { label: '5p',  pence: 5,   weight: 3.25  },
    { label: '2p',  pence: 2,   weight: 7.12  },
    { label: '1p',  pence: 1,   weight: 3.56  }
  ];

  var NOTES = [
    { label: '£50', pence: 5000 },
    { label: '£20', pence: 2000 },
    { label: '£10', pence: 1000 },
    { label: '£5',  pence: 500  }
  ];

  function fmtP(p) {
    if (p === 0) return '£0.00';
    return p >= 100 ? '£' + (p / 100).toFixed(2) : p + 'p';
  }

  // Build coin rows
  var coinGrid = document.getElementById('coinGrid');
  COINS.forEach(function(coin, i) {
    var row = document.createElement('div');
    row.className = 'coin-row coins-row';
    row.id = 'crow' + i;
    var label = document.createElement('div');
    label.className = 'coin-label';
    label.innerHTML = coin.label + '<span>' + coin.weight + 'g</span>';
    var inp = document.createElement('input');
    inp.type = 'number'; inp.id = 'cg' + i; inp.min = '0'; inp.step = 'any'; inp.placeholder = '0g';
    var cnt = document.createElement('div');
    cnt.className = 'coin-count'; cnt.id = 'ccount' + i; cnt.textContent = '—';
    var val = document.createElement('div');
    val.className = 'coin-value'; val.id = 'cval' + i; val.textContent = '—';
    row.appendChild(label); row.appendChild(inp); row.appendChild(cnt); row.appendChild(val);
    coinGrid.appendChild(row);
    inp.addEventListener('input', recalculate);
  });

  // Build notes rows
  var notesGrid = document.getElementById('notesGrid');
  NOTES.forEach(function(note, i) {
    var row = document.createElement('div');
    row.className = 'coin-row notes-row';
    row.id = 'nrow' + i;
    var label = document.createElement('div');
    label.className = 'coin-label';
    label.innerHTML = note.label + '<span>note</span>';
    var inp = document.createElement('input');
    inp.type = 'number'; inp.id = 'nq' + i; inp.min = '0'; inp.step = '1'; inp.placeholder = '0';
    var val = document.createElement('div');
    val.className = 'coin-value note-value'; val.id = 'nval' + i; val.textContent = '—';
    row.appendChild(label); row.appendChild(inp); row.appendChild(val);
    notesGrid.appendChild(row);
    inp.addEventListener('input', recalculate);
  });

  function recalculate() {
    var coinPence = 0, notePence = 0, totalItems = 0;

    COINS.forEach(function(coin, i) {
      var g = parseFloat(document.getElementById('cg' + i).value) || 0;
      var countEl = document.getElementById('ccount' + i);
      var valEl = document.getElementById('cval' + i);
      var row = document.getElementById('crow' + i);
      if (g > 0) {
        var count = Math.round(g / coin.weight);
        var p = count * coin.pence;
        coinPence += p; totalItems += count;
        countEl.textContent = count; countEl.className = 'coin-count has-value';
        valEl.textContent = fmtP(p); valEl.className = 'coin-value has-value';
        row.classList.add('active');
      } else {
        countEl.textContent = '—'; countEl.className = 'coin-count';
        valEl.textContent = '—'; valEl.className = 'coin-value';
        row.classList.remove('active');
      }
    });

    NOTES.forEach(function(note, i) {
      var qty = parseInt(document.getElementById('nq' + i).value) || 0;
      var valEl = document.getElementById('nval' + i);
      var row = document.getElementById('nrow' + i);
      if (qty > 0) {
        var p = qty * note.pence;
        notePence += p; totalItems += qty;
        valEl.textContent = fmtP(p); valEl.className = 'coin-value note-value has-value';
        row.classList.add('active');
      } else {
        valEl.textContent = '—'; valEl.className = 'coin-value note-value';
        row.classList.remove('active');
      }
    });

    document.getElementById('coinsTotal').textContent = fmtP(coinPence);
    document.getElementById('notesTotal').textContent = fmtP(notePence);
    document.getElementById('grandTotal').textContent = fmtP(coinPence + notePence);
    document.getElementById('totalItems').textContent = totalItems > 0 ? totalItems + ' coins & notes' : '0 items';
  }

  document.getElementById('stampBtn').addEventListener('click', function() {
    var now = new Date();
    var ts = now.toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short', year:'numeric' })
      + ' - ' + now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('timestamp').textContent = ts;
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    COINS.forEach(function(_, i) { document.getElementById('cg' + i).value = ''; });
    NOTES.forEach(function(_, i) { document.getElementById('nq' + i).value = ''; });
    document.getElementById('closedBy').value = '';
    document.getElementById('timestamp').textContent = '—';
    recalculate();
  });

  document.getElementById('exportBtn').addEventListener('click', function() {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    var now = new Date();
    var dateStr = now.toLocaleDateString('en-GB').replace(/\//g, '-');
    var W = 210, L = 14, R = 196;
    var y = 0;

    // Collect data
    var coinPence = 0, notePence = 0;
    var coinRows = [];
    COINS.forEach(function(coin, i) {
      var g = parseFloat(document.getElementById('cg' + i).value) || 0;
      var count = g > 0 ? Math.round(g / coin.weight) : 0;
      var p = count * coin.pence;
      coinPence += p;
      coinRows.push({ label: coin.label, g: g, count: count, p: p });
    });
    var noteRows = [];
    NOTES.forEach(function(note, i) {
      var qty = parseInt(document.getElementById('nq' + i).value) || 0;
      var p = qty * note.pence;
      notePence += p;
      noteRows.push({ label: note.label, qty: qty, p: p });
    });
    var grandTotal = coinPence + notePence;
    var closedBy = document.getElementById('closedBy').value || 'Not entered';
    var rawTs = document.getElementById('timestamp').textContent.trim();
    // jsPDF built-in font only supports Latin-1 — strip non-latin chars
    var timestamp = (rawTs === '—' || rawTs === '' || rawTs === '—') ? 'Not set' : rawTs.replace(/·/g, '-').replace(/—/g, '-').replace(/–/g, '-');

    // HEADER
    doc.setFillColor(99, 102, 241);
    doc.rect(0, 0, W, 24, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(15); doc.setFont('helvetica', 'bold');
    doc.text('Cash Closing', L, 11);
    doc.setFontSize(8); doc.setFont('helvetica', 'normal');
    doc.text(now.toLocaleDateString('en-GB', { weekday:'long', day:'2-digit', month:'long', year:'numeric' }), L, 18);
    doc.setFontSize(8.5); doc.setFont('helvetica', 'bold');
    doc.text('Closed by: ' + closedBy, R, 11, { align:'right' });
    doc.setFont('helvetica', 'normal');
    var timeOnly = now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    doc.text('Time: ' + timeOnly, R, 18, { align:'right' });
    y = 32;

    // COINS SECTION
    doc.setFillColor(99, 102, 241);
    doc.roundedRect(L, y, 22, 6, 2, 2, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(7); doc.setFont('helvetica', 'bold');
    doc.text('COINS', L + 11, y + 4.3, { align:'center' });
    y += 10;

    // Coins table header
    doc.setTextColor(140, 140, 155);
    doc.setFontSize(7); doc.setFont('helvetica', 'bold');
    doc.text('COIN', L, y);
    doc.text('WEIGHT', 80, y, { align:'center' });
    doc.text('COUNT', 130, y, { align:'center' });
    doc.text('VALUE', R, y, { align:'right' });
    y += 2;
    doc.setDrawColor(210, 210, 220); doc.setLineWidth(0.3);
    doc.line(L, y, R, y);
    y += 5;

    coinRows.forEach(function(r, idx) {
      if (idx % 2 === 0) {
        doc.setFillColor(248, 249, 255);
        doc.rect(L, y - 3.5, R - L, 7, 'F');
      }
      doc.setTextColor(30, 30, 45);
      doc.setFontSize(9); doc.setFont('helvetica', 'bold');
      doc.text(r.label, L, y);
      doc.setFont('helvetica', 'normal');
      doc.text(r.g > 0 ? r.g + 'g' : '-', 80, y, { align:'center' });
      doc.text(r.count > 0 ? String(r.count) : '-', 130, y, { align:'center' });
      if (r.p > 0) { doc.setFont('helvetica', 'bold'); doc.setTextColor(5, 150, 105); }
      doc.text(r.p > 0 ? fmtP(r.p) : '-', R, y, { align:'right' });
      doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 30, 45);
      y += 7;
    });

    // Coins subtotal
    doc.setDrawColor(100, 80, 200); doc.setLineWidth(0.4);
    doc.line(L, y - 1, R, y - 1);
    doc.setTextColor(67, 56, 202); doc.setFontSize(9); doc.setFont('helvetica', 'bold');
    doc.text('Coins Total', L, y + 4);
    doc.text(fmtP(coinPence), R, y + 4, { align:'right' });
    y += 13;

    // NOTES SECTION
    doc.setFillColor(14, 165, 233);
    doc.roundedRect(L, y, 22, 6, 2, 2, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(7); doc.setFont('helvetica', 'bold');
    doc.text('NOTES', L + 11, y + 4.3, { align:'center' });
    y += 10;

    // Notes table header
    doc.setTextColor(140, 140, 155);
    doc.setFontSize(7); doc.setFont('helvetica', 'bold');
    doc.text('NOTE', L, y);
    doc.text('QUANTITY', 110, y, { align:'center' });
    doc.text('VALUE', R, y, { align:'right' });
    y += 2;
    doc.setDrawColor(210, 210, 220); doc.setLineWidth(0.3);
    doc.line(L, y, R, y);
    y += 5;

    noteRows.forEach(function(r, idx) {
      if (idx % 2 === 0) {
        doc.setFillColor(240, 249, 255);
        doc.rect(L, y - 3.5, R - L, 7, 'F');
      }
      doc.setTextColor(30, 30, 45);
      doc.setFontSize(9); doc.setFont('helvetica', 'bold');
      doc.text(r.label, L, y);
      doc.setFont('helvetica', 'normal');
      doc.text(r.qty > 0 ? String(r.qty) : '-', 110, y, { align:'center' });
      if (r.p > 0) { doc.setFont('helvetica', 'bold'); doc.setTextColor(2, 132, 199); }
      doc.text(r.p > 0 ? fmtP(r.p) : '-', R, y, { align:'right' });
      doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 30, 45);
      y += 7;
    });

    // Notes subtotal
    doc.setDrawColor(2, 132, 199); doc.setLineWidth(0.4);
    doc.line(L, y - 1, R, y - 1);
    doc.setTextColor(2, 132, 199); doc.setFontSize(9); doc.setFont('helvetica', 'bold');
    doc.text('Notes Total', L, y + 4);
    doc.text(fmtP(notePence), R, y + 4, { align:'right' });
    y += 14;

    // GRAND TOTAL BOX
    doc.setFillColor(26, 26, 46);
    doc.roundedRect(L, y, R - L, 18, 3, 3, 'F');
    doc.setTextColor(200, 200, 210);
    doc.setFontSize(10); doc.setFont('helvetica', 'bold');
    doc.text('GRAND TOTAL', L + 6, y + 11);
    doc.setTextColor(165, 180, 252);
    doc.setFontSize(17); doc.setFont('helvetica', 'bold');
    doc.text(fmtP(grandTotal), R - 6, y + 12, { align:'right' });
    y += 26;

    // FOOTER
    doc.setDrawColor(200, 200, 220); doc.setLineWidth(0.3);
    doc.line(L, y, R, y);
    y += 7;
    doc.setTextColor(99, 102, 241);
    doc.setFontSize(9); doc.setFont('helvetica', 'bold');
    doc.textWithLink('JeJo Barista - Aylesbury', W / 2, y, { align:'center', url:'https://jejo8.github.io/port-folio/' });

    doc.save('Cash Closing ' + dateStr + '.pdf');
  });
})();
</script>
</body>
</html>
